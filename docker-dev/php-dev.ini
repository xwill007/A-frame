; El código original data de PHP 7.x; en PHP 8.2 genera warnings de "deprecated"
; (ej. pasar null a strpos()) que, si se muestran, se cuelan dentro de las respuestas
; JSON de los endpoints y las rompen. Se desactiva la salida a pantalla, pero se
; mantiene el log de errores (visible con `docker compose logs web`).
display_errors = Off
log_errors = On
error_reporting = E_ALL

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- User Registration Form -->
    <div id="forms-container"> 

    <div class="formulario-registro">
        <h2>Register to Get Started (registrarse para comenzar)</h2>
    <form id="registro-form" action="/A-frame/Proyecto/backend/modelos/usuarios/registrar_usuario.php" method="POST">
        <div class="campo">
            <label for="nombre">Full Name (nombre completo)</label>
            <div class="input-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="nombre" name="nombre" required>
            </div>
        </div>
        
        <div class="campo">
            <label for="email">Email Address (correo electronico)</label>
            <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" name="email" required>
            </div>
            <div id="email-msg" class="field-error" aria-live="polite" style="display:none;"></div>
        </div>
        
        <div class="campo">
            <label for="password">Password (contraseña)</label>
            <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" required>
            <i class="fas fa-eye eye-toggle" data-target="password" tabindex="0" aria-label="Toggle password visibility"></i>
            </div>
            <div id="password-length-msg" class="field-error" aria-live="polite" style="display:none;"></div>
        </div>
        
        <!-- Confirm password (added) -->
        <div class="campo">
            <label for="password-confirm">Confirm Password (confirmar contraseña)</label>
            <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password-confirm" name="password_confirm" required>
            <i class="fas fa-eye eye-toggle" data-target="password-confirm" tabindex="0" aria-label="Toggle password visibility"></i>
            </div>
            <div id="password-match-msg" class="field-error" aria-live="polite" style="display:none;"></div>
        </div>
        
        <div class="campo">
            <label for="nivel">English Level (nivel de ingles)</label>
            <select id="nivel" name="nivel" required>
            <option value="Beginner" selected>Beginner (principiante)</option>
            <option value="Intermediate">Intermediate (intermedio)</option>
            <option value="Advanced">Advanced (avanzado)</option>
            </select>
        </div>
        
        <div id = "form-buttons">
            <button type="submit" class="boton-registro">📝REGISTER (registrar)</button>
            <button id="btn-login" type="button" class="boton-registro">I AM REGISTERED (ya estoy registrado)</button>
        </div>
    </form>
    </div>

    <!-- Mensaje enviado desde el servidor (registrar_usuario.php) - aparecerá debajo del formulario -->
    <div id="server-message"></div>

    

    <div id="login-form" class="formulario-registro" style="display: none;">
        <h2>Log In</h2>
        <form id="login-form-fields">
        <div class="campo">
            <label for="user">Email (correo electronico):</label>
            <div class="input-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="user" name="user" required>
            </div>
        </div>

        <div class="campo">
            <label for="password-login">Password (contraseña):</label>
            <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password-login" name="password-login" required>
            <i class="fas fa-eye eye-toggle" data-target="password-login" tabindex="0" aria-label="Toggle password visibility"></i>
            </div>
        </div>

        <button id="btn-send" type="submit" class="boton-registro">Log In (iniciar sesión)</button>
        </form>
        
    </div>
  </div> 

  <script src="index.js"></script>
</body>
</html>

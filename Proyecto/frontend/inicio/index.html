<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- User Registration Form -->
    <div id="forms-container"> 

    <div class="formulario-registro">
        <h2>Register to Get Started</h2>
    <form id="registro-form" action="http://localhost/A-frame/Proyecto/backend/modelos/usuarios/registrar_usuario.php" method="POST">
        <div class="campo">
            <label for="nombre">Full Name:</label>
            <div class="input-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="nombre" name="nombre" required>
            </div>
        </div>
        
        <div class="campo">
            <label for="email">Email Address:</label>
            <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" name="email" required>
            </div>
        </div>
        
        <div class="campo">
            <label for="password">Password:</label>
            <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" name="password" required>
            </div>
        </div>
        
        <div class="campo">
            <label for="nivel">English Level:</label>
            <select id="nivel" name="nivel" required>
            <option value="">Select your level</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
            </select>
        </div>
        
    <button type="submit" class="boton-registro">📝 Register</button>
    <button id="btn-login" type="button" class="boton-registro">I AM REGISTERED</button>
        </form>
    </div>

    <!-- Mensaje enviado desde el servidor (registrar_usuario.php) - aparecerá debajo del formulario -->
    <div id="server-message"></div>

    

    <div id="login-form" class="formulario-registro" style="display: none;">
        <h2>Log In</h2>
        <form id="login-form-fields">
        <div class="campo">
            <label for="user">Username:</label>
            <div class="input-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="user" name="user" required>
            </div>
        </div>

        <div class="campo">
            <label for="password-login">Password:</label>
            <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="password-login" name="password-login" required>
            </div>
        </div>

        <button type="submit" class="boton-registro">Log In</button>
        </form>
        
    </div>
  </div> 

  <script src="index.js"></script>
</body>
</html>

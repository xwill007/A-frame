<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Registro</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="index.js" type="module" defer></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <a-scene>
        <a-entity id="formulario" position="0 1.5 -6">
            <a-entity id="nombre" position="0 2.8 0">
                <a-text value="Nombre:" color="#FFF" width="4" position="-1.5 0 0"></a-text>
                <a-plane id="nombre-input" position="0 -0.1 0" width="3" height="0.5" color="#007BFF" shadow="cast: true"></a-plane>
                <a-text id="nombre-text" value="" color="#FFF" width="3" position="0 -0.1 0.01"></a-text>
            </a-entity>

            <a-entity id="correo" position="0 2.1 0">
                <a-text value="Correo:" color="#FFF" width="4" position="-1.5 0 0"></a-text>
                <a-plane id="correo-input" position="0 -0.1 0" width="3" height="0.5" color="#007BFF" shadow="cast: true"></a-plane>
                <a-text id="correo-text" value="" color="#FFF" width="3" position="0 -0.1 0.01"></a-text>
            </a-entity>

            <a-entity id="contrasena" position="0 1.4 0">
                <a-text value="Contraseña:" color="#FFF" width="4" position="-1.5 0 0"></a-text>
                <a-plane id="contrasena-input" position="0 -0.1 0" width="3" height="0.5" color="#007BFF" shadow="cast: true"></a-plane>
                <a-text id="contrasena-text" value="" color="#FFF" width="3" position="0 -0.1 0.01"></a-text>
            </a-entity>

            <a-entity id="nivel" position="0 0.7 0">
                <a-text value="Nivel de inglés:" color="#FFF" width="4" position="-1.5 0 0"></a-text>
                <a-plane id="nivel-input" position="0 -0.1 0" width="3" height="0.5" color="#007BFF" shadow="cast: true"></a-plane>
                <a-text id="nivel-text" value="" color="#FFF" width="3" position="0 -0.1 0.01"></a-text>
            </a-entity>
        </a-entity>
    </a-scene>

    <input type="text" id="input-field" style="position: absolute; top: 10px; left: 10px; display: none;">
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Escena VR</title>
    <!-- Cargar A-Frame localmente para evitar dependencia de internet -->
    <script src="libs/aframe.min.js"></script>
    <script src="componentes/vr-formulario-registro/vr-formulario-registro.js"></script>
    <script src="componentes/vr-formulario-login/vr-formulario-login.js"></script>
    <!-- Paleta de colores para componentes VR (moved to src/) -->
    <script src="src/colors.js"></script>
    <script src="componentes/karaoke-vr/karaoke-vr.js"></script>
    <script src="componentes/evaluacion-vr/evaluacion-vr.js"></script>
    <script src="index.js"></script>
    <!-- Componente para mostrar iframes de YouTube en A-Frame -->
    <script src="https://unpkg.com/aframe-htmlembed-component/dist/aframe-htmlembed-component.min.js"></script>
    
</head>
<body>

    <a-scene background="color: #ECECEC">
        
        <!-- Cielo con nubes -->
        <a-sky src="imagenes/uni-oscuro2.jpg" rotation="0 -60 0"></a-sky>

        <!-- Plano de piso -->
        <a-circle position="0 -0.5 0" rotation="-90 0 0" radius="20" segments="64"
                  material="src: imagenes/textura-luna1.jpg; repeat: 1 1"></a-circle>

        <!-- Iluminación mejorada -->
        <a-entity light="type: ambient; color: #BBB; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; position: 0 1 1; intensity: 0.8"></a-entity>
        <a-entity light="type: point; position: 2 2 2; intensity: 0.5"></a-entity>
        
        <!-- Cámara con cursor -->
        <a-entity camera look-controls wasd-controls position="0 3.0 9">
            <a-cursor 
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: white; shader: flat"
                animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
                animation__fuse="property: scale; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500"
                raycaster="objects: .clickable"
            ></a-cursor>
        </a-entity>

       

        <!-- Karaoke VR para pruebas directas con parámetros de video local y lista de videos -->
        <a-entity 
            id="karaoke-vr-component" 
            karaoke-vr="videoPath: ./videos/mi-video.mp4; 
                videoWidth: 15; 
                videoHeight: 9; 
                videoList:  StandByMe_BenEKing.mp4|Ben E. King|2:58,itsMyLife_BonJovi.mp4|Bon Jovi|4:25,GangstasParadise_Coolio.mp4|Coolio|3:45; 
                textColor: #8a8a96ff; 
                buttonColor: #121093ff; 
                backgroundColor: #454545ff; 
                videoPosition: 0 2.5 -3; 
                listPosition: 12.0 6.15 -3; 
                escalaLista: 2.2; 
                tituloFontScale: 1.4; 
                itemFontScale: 1.35; 
                showSearchBar: true;
                searchPlaceholder: Search songs...;
                visible: true"
            position="1 2.5 3"> <!-- Ajustar posición para mayor visibilidad -->

            <!-- Los controles de video se generan dinámicamente dentro del componente `karaoke-vr` -->

        </a-entity>

    </a-scene>
</body>
</html>
